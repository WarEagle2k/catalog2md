[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog2md"
version = "1.0.0"
description = "Convert technical PDF catalogs to RAG-optimized Markdown files"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.10.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pypdf>=4.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
docling = [
    "docling>=2.9.0",
]

[project.scripts]
catalog2md = "catalog2md.cli:main"

[tool.setuptools]
packages = ["catalog2md"]
